[env:esp32-s3-super-mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

; Board thực tế báo flash 4 MB (không phải 8 MB như profile DevKitC mặc định).
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv

monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder

; Giữ USB CDC qua USB tích hợp của ESP32-S3 sau khi reset.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; Tắt WiFi/Bluetooth không dùng để giảm footprint nếu cần:
; board_build.partitions = huge_app.csv
