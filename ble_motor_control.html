<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ESP32 Motor Control</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap');
    :root {
      --bg: #090d10;
      --surface: #111820;
      --surface-2: #18212a;
      --metal: #252e36;
      --border: #3a444d;
      --accent: #f5b928;
      --accent-light: #ffd45a;
      --text: #f3f4f2;
      --muted: #aeb9be;
      --cyan: #37d7dd;
      --danger: #e83f4f;
      --danger-dark: #711f2b;
      --font-page-title: clamp(20px, 2.8vw, 28px);
      --font-section-title: clamp(13px, 1.6vw, 16px);
      --font-body: clamp(12px, 1.35vw, 14px);
      --font-small: clamp(11px, 1.15vw, 12px);
      --font-button: clamp(12px, 1.35vw, 14px);
      --font-value: clamp(28px, 4vw, 40px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #090d10 0%, #0d141a 52%, #090d10 100%);
      color: var(--text);
      font: 15px/1.35 "Inter", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    main {
      width: min(100%, 430px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      padding: 20px 18px 28px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-right: max(18px, env(safe-area-inset-right));
      padding-bottom: max(28px, env(safe-area-inset-bottom));
      padding-left: max(18px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    .landscape-left,
    .landscape-right {
      display: contents;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: clamp(10px, 1.2vw, 13px);
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    h1 {
      margin: 3px 0 0;
      font: 700 var(--font-page-title)/1.05 "Chakra Petch", "Inter", system-ui, sans-serif;
      letter-spacing: .01em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 1px solid var(--accent);
      border-radius: 2px;
      display: grid;
      place-items: center;
      color: var(--accent);
      clip-path: polygon(0 7px, 7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%);
    }

    .brand-mark svg {
      width: 24px;
      height: 24px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background: linear-gradient(145deg, var(--surface-2), var(--surface));
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 14px;
      box-shadow: inset 0 1px #ffffff0d, inset 0 -2px #0008, 0 10px 24px #0006;
      clip-path: polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px));
    }

    .card::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      opacity: .2;
      pointer-events: none;
      background: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px), repeating-linear-gradient(135deg, transparent 0 18px, #ffffff08 19px 20px);
      background-size: 42px 42px, 42px 42px, auto;
      mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
    }

    .control-card::before,
    .speed-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 14px;
      width: 46px;
      height: 3px;
      background: var(--accent);
      box-shadow: 0 0 8px #f5b9282e;
      pointer-events: none;
    }

    .control-card::after {
      opacity: .26;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 5px #8e9aa31c;
    }

    .dot.connected {
      background: var(--cyan);
      box-shadow: 0 0 0 5px #37d7dd29;
    }

    .dot.is-connecting {
      background: var(--accent);
      animation: statusPulse 1.4s ease-in-out infinite;
    }

    .status-copy {
      flex: 1;
      min-width: 0;
    }

    .status-copy strong {
      display: block;
      font-size: clamp(14px, 1.8vw, 18px);
      font-weight: 700;
      white-space: nowrap;
    }

    .status-copy span {
      color: #c0c9cd;
      font-size: var(--font-small);
      white-space: nowrap;
    }

    .system-status {
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid #ffffff14;
      color: #cbd5d8;
      font-size: var(--font-body);
      min-width: 0;
    }

    button {
      border: 0;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .connect {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: 2px;
      background: var(--accent);
      color: #171205;
      font-weight: 750;
      font-size: var(--font-button);
      white-space: nowrap;
      clip-path: polygon(0 6px, 6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
      transition: background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease, transform 80ms ease;
    }

    .connect:hover,
    .connect:focus-visible {
      background: var(--accent-light);
      box-shadow: 0 0 10px #f5b92845;
    }

    .connect:active {
      transform: translateY(1px);
    }

    .connect:disabled {
      opacity: .55;
      cursor: wait;
    }

    .section-label {
      margin: 0 0 10px;
      color: var(--accent-light);
      font-size: var(--font-section-title);
      font-weight: 700;
      letter-spacing: .01em;
      white-space: nowrap;
    }

    .speed-line {
      display: flex;
      justify-content: space-between;
      align-items: end;
    }

    .speed-value {
      color: var(--accent-light);
      font: 700 var(--font-value)/1 "Chakra Petch", "Inter", system-ui, sans-serif;
      letter-spacing: -.03em;
    }

    .speed-value small {
      color: var(--muted);
      font: 400 12px/1.2 "Inter", system-ui, sans-serif;
      letter-spacing: 0;
    }

    .speed-technical {
      display: block;
      margin-top: 5px;
      color: #c0c9cd;
      font: 500 var(--font-small)/1.2 "Inter", system-ui, sans-serif;
      letter-spacing: 0;
      white-space: nowrap;
    }

    input[type=range] {
      width: 100%;
      height: 30px;
      margin: 8px 0 0;
      cursor: pointer;
      appearance: none;
      background: transparent;
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      border: 1px solid #4a5861;
      background: linear-gradient(90deg, var(--accent) var(--progress, 71%), #28343d var(--progress, 71%));
    }

    input[type=range]::-moz-range-track {
      height: 6px;
      border: 1px solid #4a5861;
      background: #28343d;
    }

    input[type=range]::-moz-range-progress {
      height: 6px;
      background: var(--accent);
    }

    input[type=range]::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
      margin-top: -7px;
      appearance: none;
      border: 2px solid var(--accent-light);
      border-radius: 50%;
      background: #111820;
      box-shadow: 0 0 8px #f5b92880;
    }

    input[type=range]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 2px solid var(--accent-light);
      border-radius: 50%;
      background: #111820;
      box-shadow: 0 0 8px #f5b92880;
    }

    input[type=range]:focus-visible::-webkit-slider-thumb {
      box-shadow: 0 0 0 4px #f5b92835, 0 0 10px #f5b92880;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      color: #c0c9cd;
      font-size: var(--font-small);
    }

    .speed-presets {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 9px;
    }

    .speed-preset {
      min-width: 0;
      min-height: 40px;
      padding: 7px 8px;
      border: 1px solid #46545e;
      background: linear-gradient(145deg, #26323b, #141c22);
      color: var(--text);
      font: 700 13px/1 Inter, system-ui, sans-serif;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .speed-preset:not(:disabled):hover,
    .speed-preset:not(:disabled):focus-visible {
      border-color: var(--accent-light);
    }

    .speed-preset[aria-pressed="true"] {
      border-color: var(--accent-light);
      background: var(--accent);
      color: #11161a;
      box-shadow: 0 0 10px #f5b92845, inset 0 2px 4px #fff3;
    }

    .speed-preset:disabled {
      opacity: .78;
      filter: none;
      cursor: not-allowed;
    }

    .control-card {
      padding: 16px 17px 18px;
    }

    .direction-pad {
      width: 100%;
      max-width: 270px;
      margin: 6px auto 12px;
      display: grid;
      grid-template-columns: minmax(64px, auto) 52px minmax(64px, auto);
      grid-template-rows: auto auto auto;
      align-items: center;
      justify-content: center;
      column-gap: 10px;
      row-gap: 7px;
    }

    .pad-item {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .pad-item button {
      width: 52px;
      height: 48px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      background: linear-gradient(145deg, #28343d, #182129);
      border: 1px solid #5a6872;
      border-radius: 2px;
      font-size: 22px;
      color: var(--text);
      transition: .12s transform, .12s background, .12s box-shadow;
      touch-action: none;
      clip-path: polygon(0 7px, 7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .control-label {
      max-width: 100%;
      color: #cbd5d8;
      font: 600 clamp(11px, 1.5vw, 13px)/1.2 "Inter", system-ui, sans-serif;
      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .pad-item button:active,
    .pad-item button.active {
      transform: scale(.95);
      background: var(--accent);
      color: #171205;
      border-color: var(--accent-light);
      box-shadow: inset 0 0 0 2px #8c6713, inset 0 4px 8px #0007;
    }

    .forward {
      grid-column: 2;
      grid-row: 1;
    }

    .left {
      grid-column: 1;
      grid-row: 2;
    }

    .stop {
      grid-column: 2;
      grid-row: 2;
    }

    .right {
      grid-column: 3;
      grid-row: 2;
    }

    .reverse {
      grid-column: 2;
      grid-row: 3;
    }

    .stop button {
      color: var(--danger);
    }

    .drive-status {
      min-height: 20px;
      margin-top: 8px;
      color: #e0e6e7;
      text-align: center;
      font-size: var(--font-body);
      font-weight: 600;
      white-space: nowrap;
    }

    .drive-status.is-moving::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px #f5b9288c;
      animation: statusPulse 1.4s ease-in-out infinite;
    }

    .hint {
      text-align: center;
      color: #cbd5d8;
      font-size: var(--font-body);
      letter-spacing: 0;
    }

    .rotation-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #ffffff14;
    }

    .rotation-description {
      margin: -4px 0 8px;
      color: #aeb9be;
      font-size: var(--font-small);
    }

    .rotation-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      width: min(100%, 230px);
      margin-inline: auto;
    }

    .rotation-button {
      min-width: 0;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 6px;
      color: var(--text);
      background: linear-gradient(145deg, #26323b, #141c22);
      border: 1px solid #3d4b55;
      border-radius: 2px;
      font-size: var(--font-button);
      font-weight: 700;
      white-space: nowrap;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      clip-path: polygon(0 6px, 6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
      box-shadow: inset 0 1px #ffffff14, inset 0 -4px 8px #0005, 0 3px 8px #0005;
      transition: background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease, transform 80ms ease;
    }

    .rotation-button .icon {
      font-size: 22px;
      line-height: 1;
    }

    .rotation-button:hover:not(:disabled),
    .rotation-button:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 10px #f5b92835, inset 0 1px #ffffff14;
    }

    .rotation-button:active:not(:disabled),
    .rotation-button.active {
      color: #11161a;
      background: linear-gradient(145deg, #ffd052, #e5a816);
      border-color: var(--accent-light);
      transform: translateY(2px);
      box-shadow: 0 0 12px #f5b92852, inset 0 2px 3px #ffffff38;
    }

    .rotation-button:disabled {
      cursor: not-allowed;
      opacity: .82;
      filter: none;
    }

    .emergency {
      width: 100%;
      min-height: 48px;
      padding: 12px 15px;
      border-radius: 2px;
      background: var(--danger-dark);
      border: 1px solid var(--danger);
      color: #ffd8dc;
      font-weight: 900;
      font-size: var(--font-button);
      letter-spacing: .07em;
      text-transform: uppercase;
      white-space: nowrap;
      clip-path: polygon(0 7px, 7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%);
      box-shadow: inset 0 1px #fff2, 0 5px 14px #0005;
    }

    .emergency::before {
      content: "⚠";
      display: inline-block;
      margin-right: 8px;
      font-size: 16px;
      vertical-align: -1px;
    }

    .emergency-note {
      display: block;
      margin-bottom: 6px;
      color: #c2cdd1;
      font-size: 11px;
      text-align: center;
    }

    .emergency:active {
      background: var(--danger);
      color: #fff;
      transform: translateY(1px);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      padding: 0 3px;
    }

    @keyframes statusPulse {

      0%,
      100% {
        opacity: .55;
        box-shadow: 0 0 0 0 #f5b92800;
      }

      50% {
        opacity: 1;
        box-shadow: 0 0 0 5px #f5b9281f;
      }
    }

    .servo-control {
      display: grid;
      gap: 4px;
      margin-top: 6px;
      min-width: 0;
    }

    .servo-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .servo-heading strong {
      color: var(--accent-light);
      white-space: nowrap;
    }

    .servo-toggle {
      width: 100%;
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid var(--accent);
      background: #252d33;
      color: var(--text);
      font: 700 12px/1.2 Inter, system-ui, sans-serif;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .servo-toggle:not(:disabled):active {
      background: var(--accent);
      color: #11161a;
      transform: translateY(1px);
    }

    @media (orientation:portrait) {
      .status-card {
        order: 1;
      }

      .speed-card {
        order: 2;
      }

      .landscape-left {
        order: 3;
      }

      .control-card {
        order: 3;
      }

      .landscape-right {
        display: contents;
      }

      .emergency {
        order: 4;
      }

      .footer {
        order: 5;
      }
    }

    @media (orientation:landscape) and (min-width:568px) {
      main {
        width: 100%;
        max-width: 980px;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        padding: 10px 14px;
        padding-top: max(10px, env(safe-area-inset-top));
        padding-right: max(14px, env(safe-area-inset-right));
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        padding-left: max(14px, env(safe-area-inset-left));
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(250px, .95fr);
        grid-template-rows: auto minmax(0, 1fr);
        gap: 8px 10px;
        overflow: hidden;
      }

      header {
        grid-column: 1 / -1;
        min-width: 0;
      }

      .landscape-left {
        display: flex;
        grid-column: 1;
        grid-row: 2;
        min-width: 0;
        min-height: 0;
      }

      .landscape-right {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-column: 2;
        grid-row: 2;
        gap: 8px;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .control-card {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .status-card {
        grid-row: 1;
        min-width: 0;
      }

      .speed-card {
        grid-row: 2;
        min-width: 0;
        min-height: 0;
        align-self: stretch;
      }

      .emergency {
        grid-row: 3;
        min-width: 0;
      }

      .direction-pad {
        max-width: 270px;
        margin: 6px auto 8px;
      }

      .footer {
        display: none;
      }
    }

    @media (orientation:landscape) and (max-height:600px) {
      main {
        padding-top: max(6px, env(safe-area-inset-top));
        padding-bottom: max(6px, env(safe-area-inset-bottom));
        gap: 6px 8px;
      }

      h1 {
        font-size: 21px;
        margin-top: 1px;
      }

      .eyebrow {
        font-size: 10px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 2px;
      }

      .brand-mark svg {
        width: 19px;
        height: 19px;
      }

      .card {
        padding: 8px 10px;
      }

      .status-row {
        gap: 7px;
      }

      .status-copy strong {
        font-size: 14px;
      }

      .status-copy span,
      .range-labels {
        font-size: 11px;
      }

      .section-label {
        font-size: 12px;
      }

      .hint {
        font-size: 11px;
      }

      .connect {
        min-height: 42px;
        margin-top: 6px;
        padding: 7px 8px;
        font-size: 12px;
      }

      .speed-value {
        font-size: 29px;
      }

      input[type=range] {
        margin: 2px 0 0;
      }

      .control-card {
        padding: 10px 12px;
      }

      .direction-pad {
        max-width: 230px;
        grid-template-columns: 64px 48px 64px;
        column-gap: 8px;
        row-gap: 5px;
        margin: 2px auto 4px;
      }

      .pad-item button {
        width: 48px;
        height: 44px;
        font-size: 20px;
      }

      .control-label {
        font-size: 11px;
      }

      .emergency {
        min-height: 44px;
        padding: 8px;
        font-size: 13px;
      }

      .emergency-note {
        display: none;
      }

      .rotation-section {
        margin-top: 7px;
        padding-top: 6px;
      }

      .rotation-description {
        display: none;
      }

      .rotation-controls {
        gap: 6px;
      }

      .rotation-button {
        min-height: 40px;
        font-size: 11px;
      }

      .rotation-button .icon {
        font-size: 18px;
      }

      .system-status {
        margin-top: 5px;
        padding-top: 5px;
        font-size: 11px;
      }

      .footer {
        display: none;
      }
    }

    @media (orientation:landscape) and (max-height:400px) {
      .hint {
        display: none;
      }

      .direction-pad {
        row-gap: 3px;
        margin-bottom: 3px;
      }

      .pad-item button {
        width: 44px;
        height: 42px;
        min-height: 40px;
      }

      .drive-status {

    /* XPERT / NEXT HORIZON visual language: deep space, white HUD lines,
       electric cyan and violet accents with angular hardware panels. */
    :root {
      --bg: #050b18;
      --surface: #091426;
      --surface-2: #10203a;
      --metal: #182b48;
      --border: #2e5b8e;
      --accent: #42d9ff;
      --accent-light: #c1f5ff;
      --text: #f7fbff;
      --muted: #91a9c4;
      --cyan: #42d9ff;
      --purple: #8068ff;
      --danger: #ff5577;
      --danger-dark: #46172e;
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at 78% 12%, #4230a82e 0 12%, transparent 36%),
        radial-gradient(circle at 18% 72%, #087db52e 0 10%, transparent 32%),
        linear-gradient(135deg, #040915 0%, #08162a 52%, #050a18 100%);
      font-family: "Arial Narrow", "Rajdhani", "Chakra Petch", Inter, system-ui, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .52;
      background-image:
        radial-gradient(circle, #ffffffb8 0 1px, transparent 1.5px),
        radial-gradient(circle, #42d9ff99 0 1px, transparent 1.5px);
      background-size: 83px 97px, 137px 151px;
      background-position: 13px 21px, 47px 73px;
      mask-image: linear-gradient(120deg, transparent 0%, black 28%, black 78%, transparent 100%);
    }

    main {
      position: relative;
      z-index: 1;
    }

    header {
      border-bottom-color: #d9f7ff8c;
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -1px;
      width: 30%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent));
      box-shadow: 0 0 12px #42d9ffb8;
    }

    .eyebrow,
    .section-label,
    .speed-value {
      color: var(--accent-light);
      text-shadow: 0 0 12px #42d9ff66;
    }

    h1 {
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .brand-mark {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 16px #42d9ff55, inset 0 0 12px #42d9ff1c;
    }

    .card {
      background:
        linear-gradient(145deg, #142a49e8, #071326f2),
        radial-gradient(circle at 80% 0%, #8068ff24, transparent 45%);
      border-color: #3c72a8;
      box-shadow: inset 0 1px #ffffff18, inset 0 -2px #000b,
        0 10px 28px #0009, 0 0 18px #183e6b42;
    }

    .card::after {
      opacity: .24;
      background:
        linear-gradient(#ffffff0b 1px, transparent 1px),
        linear-gradient(90deg, #ffffff08 1px, transparent 1px),
        repeating-linear-gradient(135deg, transparent 0 18px, #42d9ff0b 19px 20px);
      background-size: 42px 42px, 42px 42px, auto;
    }

    .control-card::before,
    .speed-card::before {
      width: 72px;
      background: linear-gradient(90deg, var(--accent), var(--purple));
      box-shadow: 0 0 12px #42d9ff8a;
    }

    .connect,
    .speed-preset[aria-pressed="true"],
    .pad-item button:active,
    .pad-item button.active,
    .rotation-button:active:not(:disabled),
    .rotation-button.active {
      background: linear-gradient(135deg, #42d9ff, #7864ff) !important;
      color: #06101f !important;
      border-color: var(--accent-light) !important;
      box-shadow: 0 0 18px #42d9ff70, inset 0 0 0 1px #ffffff80 !important;
    }

    .connect:hover,
    .connect:focus-visible,
    .speed-preset:not(:disabled):hover,
    .speed-preset:not(:disabled):focus-visible,
    .rotation-button:hover:not(:disabled),
    .rotation-button:focus-visible {
      border-color: var(--accent-light);
      box-shadow: 0 0 14px #42d9ff75, inset 0 0 0 1px #ffffff28;
    }

    .speed-preset,
    .pad-item button,
    .rotation-button,
    .servo-toggle {
      background: linear-gradient(145deg, #173052, #0a172b);
      border-color: #477db2;
      box-shadow: inset 0 1px #ffffff18, inset 0 -4px 8px #0007,
        0 3px 10px #0006;
    }

    input[type=range]::-webkit-slider-runnable-track {
      border-color: #477db2;
      background: linear-gradient(90deg, var(--accent) var(--progress, 71%), #142b49 var(--progress, 71%));
    }

    input[type=range]::-moz-range-track {
      border-color: #477db2;
      background: #142b49;
    }

    input[type=range]::-moz-range-progress {
      background: var(--accent);
    }

    input[type=range]::-webkit-slider-thumb,
    input[type=range]::-moz-range-thumb {
      border-color: var(--accent-light);
      background: #08172d;
      box-shadow: 0 0 10px #42d9ffb8;
    }

    .dot.connected {
      background: var(--accent);
      box-shadow: 0 0 0 5px #42d9ff29, 0 0 14px #42d9ff;
    }

    .emergency {

    .card::before,
    .panel::before {
      transform-origin: left center;
      animation: panelAccentPulse 3.2s ease-in-out infinite alternate;
    }

    .dot.connected {
      animation: connectedPulse 1.8s ease-in-out infinite;
    }

    .connect:not(:disabled),
    .servo-toggle:not(:disabled) {
      transition: transform 120ms ease, filter 180ms ease, box-shadow 180ms ease;
    }

    .connect:not(:disabled):hover,
    .servo-toggle:not(:disabled):hover,
    .speed-preset:not(:disabled):hover,
    .linear-button:not(:disabled):hover,
    .rotation-button:not(:disabled):hover {
      animation: buttonHoverGlow 1.5s ease-in-out infinite alternate;
    }

    @keyframes starfieldDrift {
      from { background-position: 17px 13px, 49px 77px, 91px 33px; }
      to { background-position: 57px 43px, 9px 117px, 151px 83px; }
    }

    @keyframes gridDrift {
      from { background-position: 0 0; }
      to { background-position: 160px 160px; }
    }

    @keyframes framePulse {
      0%, 100% { opacity: .72; box-shadow: inset 0 0 18px rgba(58, 190, 255, .04); }
      50% { opacity: 1; box-shadow: inset 0 0 22px rgba(58, 190, 255, .12), 0 0 12px rgba(118, 92, 255, .08); }
    }

    @keyframes energySweep {
      0%, 100% { opacity: .72; transform: scaleX(.78); }
      50% { opacity: 1; transform: scaleX(1); }
    }

    @keyframes energyBarFlow {
      0% { background-position: 100% 0; }
      100% { background-position: -120% 0; }
    }

    @keyframes energyBarPulse {
      0% {
        opacity: .65;
        box-shadow: 0 0 8px rgba(65, 223, 255, .38);
      }
      100% {
        opacity: 1;
        box-shadow: 0 0 18px rgba(65, 223, 255, .9),
          0 0 28px rgba(118, 92, 255, .45);
      }
    }

    @keyframes energyBarLength {
      0%, 100% {
        width: clamp(118px, 26%, 280px);
        height: 3px;
      }
      35% {
        width: clamp(150px, 52%, 520px);
        height: 5px;
      }
      68% {
        width: clamp(132px, 38%, 390px);
        height: 4px;
      }
    }

    @keyframes energyLineMorph {
      0%, 100% { width: 15%; }
      38% { width: 42%; }
      72% { width: 26%; }
    }

    @keyframes energyLine {
      0%, 100% { opacity: .45; transform: scaleX(.7); transform-origin: right; }
      50% { opacity: 1; transform: scaleX(1); }
    }

    @keyframes panelScan {
      0% { background-position: 0 0, 0 0, 0 0; }
      100% { background-position: 0 48px, 48px 0, 80px 0; }
    }

    @keyframes panelAccentPulse {
      0% { transform: scaleX(.58); opacity: .62; }
      55% { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(1.28); opacity: .8; }
    }

    @keyframes connectedPulse {
      0%, 100% { filter: brightness(.9); }
      50% { filter: brightness(1.35); }
    }

    @keyframes buttonHoverGlow {
      from { filter: brightness(1); }
      to { filter: brightness(1.16); }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      body::after,
      main::before,
      .header::before,
      .header::after,
      .card::after,
      .dot.connected,
      .connect:not(:disabled):hover,
      .servo-toggle:not(:disabled):hover,
      .speed-preset:not(:disabled):hover,
      .linear-button:not(:disabled):hover,
      .rotation-button:not(:disabled):hover {
        animation: none !important;
      }
    }
    /* Premium HUD motion: startup, tactile controls and BLE feedback. */
    @keyframes hudReveal {
      0% { opacity: 0; transform: translateY(4px); clip-path: inset(0 100% 0 0); }
      70% { opacity: 1; transform: translateY(0); clip-path: inset(0 0 0 0); }
      100% { opacity: 1; transform: translateY(0); clip-path: inset(0 0 0 0); }
    }

    @keyframes hudLightSweep {
      0% { transform: translateX(-130%); opacity: 0; }
      20% { opacity: .9; }
      100% { transform: translateX(170%); opacity: 0; }
    }

    @keyframes energyBurst {
      0% { box-shadow: 0 0 0 rgba(66,217,255,0); }
      35% { box-shadow: 0 0 24px rgba(66,217,255,.62), 0 0 32px rgba(128,104,255,.28); }
      100% { box-shadow: 0 0 8px rgba(66,217,255,.22); }
    }

    /* Startup runs once and never blocks interaction handlers. */
    main > header { animation: hudReveal 300ms cubic-bezier(.2,.8,.2,1) 60ms both; }
    main > .speed-card { animation: hudReveal 300ms cubic-bezier(.2,.8,.2,1) 140ms both; }
    main > .control-layout > .linear-panel { animation: hudReveal 300ms cubic-bezier(.2,.8,.2,1) 220ms both; }
    main > .control-layout > .pivot-panel { animation: hudReveal 300ms cubic-bezier(.2,.8,.2,1) 300ms both; }
    main > .control-layout > .emergency { animation: hudReveal 300ms cubic-bezier(.2,.8,.2,1) 380ms both; }

    /* Hover uses one light sweep; held controls remain visually stable. */
    .linear-button,
    .rotation-button,
    .speed-preset,
    .servo-toggle {
      animation: none !important;
      transition: transform 140ms ease, color 140ms ease, background 180ms ease,
        border-color 140ms ease, box-shadow 180ms ease, filter 140ms ease !important;
    }

    .linear-button::before,
    .rotation-button::before,
    .speed-preset::before,
    .servo-toggle::before {
      background: linear-gradient(90deg, transparent, #ffffffed 45%, #42d9ff 60%, transparent) !important;
      background-size: 220% 100% !important;
      background-position: 130% 0 !important;
    }

    .linear-button:hover:not(:disabled),
    .rotation-button:hover:not(:disabled) {
      transform: translateY(-1px) !important;
      filter: brightness(1.08);
    }

    .linear-button:hover:not(:disabled)::before,
    .rotation-button:hover:not(:disabled)::before,
    .speed-preset:hover:not(:disabled)::before,
    .servo-toggle:hover:not(:disabled)::before {
      animation: hudLightSweep 520ms ease-out 1 !important;
    }

    .linear-button:active:not(:disabled),
    .linear-button.active,
    .rotation-button:active:not(:disabled),
    .rotation-button.active {
      animation: energyBurst 220ms ease-out 1 !important;
      transform: translateY(1px) scale(.985) !important;
    }

    .linear-button:active:not(:disabled)::after,
    .linear-button.active::after,
    .rotation-button:active:not(:disabled)::after,
    .rotation-button.active::after {
      opacity: .82 !important;
    }

    .speed-preset[aria-pressed="true"] {
      animation: energyBurst 220ms ease-out 1 !important;
    }

    .speed-preset[aria-pressed="true"]::before {
      animation: hudLightSweep 620ms ease-out 1 !important;
    }

    /* BLE connection states. */
    .dot.is-connecting {
      position: relative;
      animation: none !important;
    }

    .dot.is-connecting::before,
    .dot.is-connecting::after {
      content: "";
      position: absolute;
      inset: -5px;
      border: 1px solid #42d9ffb8;
      border-radius: 50%;
      animation: connectionRing 1.6s ease-out infinite;
      pointer-events: none;
    }

    .dot.is-connecting::after { animation-delay: 800ms; }
    .dot.connected { animation: connectionBreath 4s ease-in-out 1; }

    @keyframes connectionRing {
      0% { transform: scale(.55); opacity: .9; }
      100% { transform: scale(2.1); opacity: 0; }
    }

    @keyframes connectionBreath {
      0% { filter: brightness(2); box-shadow: 0 0 0 4px #42d9ff44, 0 0 28px #42d9ff; }
      25% { filter: brightness(1.5); box-shadow: 0 0 0 7px #42d9ff2e, 0 0 22px #42d9ff; }
      100% { filter: brightness(1); box-shadow: 0 0 0 4px #42d9ff1c, 0 0 12px #42d9ff88; }
    }

    @media (prefers-reduced-motion: reduce) {
      main > header,
      main > .speed-card,
      main > .control-layout > .linear-panel,
      main > .control-layout > .pivot-panel,
      main > .control-layout > .emergency,
      .linear-button,
      .rotation-button,
      .speed-preset,
      .servo-toggle,
      .dot.is-connecting::before,
      .dot.is-connecting::after,
      .dot.connected {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="header">
      <div class="header-brand">
        <div>
          <div class="eyebrow">BẢNG ĐIỀU KHIỂN</div>
          <h1>Điều khiển xe</h1>
        </div>
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24">
            <path d="M5 9h14v8H5z" />
            <path d="M8 9V6h8v3M8 13h.01M16 13h.01M8 17v2m8-2v2M3 12h2m14 0h2" />
          </svg></div>
      </div>
      <div class="header-ble-status" aria-live="polite">
        <i class="dot" id="dot"></i>
        <div class="header-ble-copy"><strong id="status">Chưa kết nối</strong><span
            id="deviceName">ESP32-MOTOR</span><span id="systemStatus" class="sr-only">Kết nối thiết bị để bắt
            đầu</span><span id="signal" class="sr-only">—</span></div>
      </div>
      <div class="header-actions">
        <button class="connect header-connect-button" id="connectBtn">Kết nối thiết bị</button>
        <button class="fullscreen-button" id="fullscreenBtn" type="button" aria-label="Bật toàn màn hình"
          title="Bật toàn màn hình">⛶</button>
      </div>
    </header>

    <section class="card panel speed-card">
      <div class="speed-line">
        <div class="section-label">Tốc độ</div>
        <div class="speed-value"><span id="speedPercent">0%</span></div>
      </div>
      <div class="speed-presets" role="group" aria-label="Chọn tốc độ">
        <button class="speed-preset" type="button" data-pwm="191" aria-pressed="false">SLOW</button>
        <button class="speed-preset" type="button" data-pwm="217" aria-pressed="false">MEDIUM</button>
        <button class="speed-preset" type="button" data-pwm="255" aria-pressed="false">HIGH</button>
      </div>
      <div class="servo-control">
        <div class="servo-heading"><span class="section-label">Servo</span><strong id="servoAngle">Nâng · 0°</strong>
        </div>
        <button id="servoToggle" class="servo-toggle" type="button" disabled>Hạ</button>
      </div>
    </section>

    <div class="control-layout">
      <section class="card panel linear-panel">
        <div class="section-label">Điều khiển di chuyển</div>
        <div class="rotation-description linear-spacer" aria-hidden="true"></div>
        <div class="linear-controls">
          <div class="pad-item"><button class="linear-button" data-command="f" aria-label="Tiến">↑<span
                class="control-label">Tiến</span></button></div>
          <div class="pad-item"><button class="linear-button" data-command="b" aria-label="Lùi">↓<span
                class="control-label">Lùi</span></button></div>
        </div>
        <div class="panel-footer">
          <div class="drive-status" id="driveStatus" aria-live="polite">Xe đang dừng</div>
          <div class="hint">Nhấn giữ để di chuyển • Thả tay để dừng</div>
        </div>
      </section>

      <section class="card panel pivot-panel">
        <div class="section-label">Xoay tại chỗ</div>
        <div class="rotation-description">Hai bánh quay ngược chiều</div>
        <div class="rotation-controls">
          <div class="pad-item">
            <button id="turnLeftBtn" class="rotation-button" data-command="l" aria-label="Xoay trái tại chỗ"
              title="Xoay trái tại chỗ">↺<span class="control-label">Xoay trái</span></button>
          </div>
          <div class="pad-item">
            <button id="turnRightBtn" class="rotation-button" data-command="r" aria-label="Xoay phải tại chỗ"
              title="Xoay phải tại chỗ">↻<span class="control-label">Xoay phải</span></button>
          </div>
        </div>
        <div class="panel-footer">
          <div class="drive-status pivot-status" aria-live="polite">Giữ nút để xoay</div>
          <div class="hint">Nhấn giữ để xoay • Thả tay để dừng</div>
        </div>
      </section>

      <button class="emergency" id="emergency">DỪNG KHẨN CẤP</button>
    </div>
    <div class="footer"><span>ESP32-MOTOR</span><span id="lastCommand">Chưa có lệnh</span></div>
  </main>
  <script>
    const SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
    let device, rxChar, txChar;
    let bleWriteRunning = false;
    let pendingMotionPayload = null;
    const pendingOtherPayloads = [];
    const bleEncoder = new TextEncoder();
    let isConnecting = false;
    let disconnectHandler = null;
    const $ = id => document.getElementById(id);
    const rotationButtons = [$('turnLeftBtn'), $('turnRightBtn')];
    const servoToggle = $('servoToggle');
    const speedPresets = [...document.querySelectorAll('.speed-preset')];
    function setRotationAvailability(enabled) {
      rotationButtons.forEach(button => { button.disabled = !enabled; });
      document.querySelectorAll('[data-command]').forEach(button => { button.disabled = !enabled; });
      servoToggle.disabled = !enabled;
      speedPresets.forEach(button => { button.disabled = !enabled; });
    }
    setRotationAvailability(false);
    function setSystemStatus(text) { $('systemStatus').textContent = text; }
    function setDriveStatus(text) { $('driveStatus').textContent = text; $('driveStatus').classList.toggle('is-moving', text !== 'Xe đang dừng'); }
    function setStatus(text, connected = false) { $('status').textContent = text; $('dot').classList.toggle('connected', connected); $('signal').textContent = connected ? '●' : '—'; setSystemStatus(connected ? 'Xe sẵn sàng điều khiển' : 'Hãy kết nối thiết bị để bắt đầu'); }
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    async function authenticateBle(password) {
      setStatus('Đang xác thực…');
      const result = new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error('Hết thời gian xác thực')), 4000);
        const onNotification = event => {
          const message = new TextDecoder().decode(event.target.value).trim();
          if (message === 'AUTH OK' || message === 'AUTH FAIL' || message === 'AUTH REQUIRED') {
            clearTimeout(timeout);
            txChar.removeEventListener('characteristicvaluechanged', onNotification);
            if (message === 'AUTH OK') resolve(message);
            else reject(new Error('Mật khẩu không đúng'));
          }
        };
        txChar.addEventListener('characteristicvaluechanged', onNotification);
      });
      await rxChar.writeValue(new TextEncoder().encode('AUTH:' + password));
      await result;
    }
    async function connectGattWithRetry(selectedDevice) {
      let lastError;
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          const server = selectedDevice.gatt.connected ? selectedDevice.gatt : await selectedDevice.gatt.connect();
          const service = await server.getPrimaryService(SERVICE);
          const rx = await service.getCharacteristic(RX);
          const tx = await service.getCharacteristic(TX);
          await tx.startNotifications();
          return { rx, tx };
        } catch (error) {
          lastError = error;
          rxChar = null;
          txChar = null;
          try { if (selectedDevice.gatt?.connected) selectedDevice.gatt.disconnect(); } catch (_) { }
          if (attempt < 3) await wait(350 * attempt);
        }
      }
      throw lastError;
    }
    async function connectBle() {
      if (isConnecting) return;
      if (!navigator.bluetooth) return alert('Trình duyệt chưa hỗ trợ Web Bluetooth. Hãy dùng Chrome/Edge trên Android hoặc HTTPS/localhost.');
      if (device?.gatt?.connected) { device.gatt.disconnect(); setRotationAvailability(false); setStatus('Chưa kết nối'); $('connectBtn').textContent = 'Kết nối thiết bị'; return; }
      isConnecting = true;
      $('connectBtn').disabled = true; $('connectBtn').textContent = 'Đang kết nối…'; $('dot').classList.add('is-connecting');
      try {
        // requestDevice phải được gọi trực tiếp từ thao tác bấm nút.
        // Không gọi prompt trước bước này vì sẽ làm mất user gesture.
        const selectedDevice = await navigator.bluetooth.requestDevice({
          // Lọc theo tên; service vẫn được kiểm tra sau khi kết nối qua
          // getPrimaryService(SERVICE). Cách này tránh phụ thuộc việc UUID
          // 128-bit nằm trong advertising packet hay scan response.
          filters: [{ namePrefix: 'ESP32-MOTOR' }],
          optionalServices: [SERVICE]
        });
        const password = window.prompt('Nhập mật khẩu kết nối thiết bị:');
        if (password === null) {
          isConnecting = false;
          $('connectBtn').disabled = false;
          $('connectBtn').textContent = 'Kết nối thiết bị';
          $('dot').classList.remove('is-connecting');
          return;
        }
        if (device && disconnectHandler) device.removeEventListener('gattserverdisconnected', disconnectHandler);
        device = selectedDevice;
        disconnectHandler = () => { pendingMotionPayload = null; pendingOtherPayloads.length = 0; setRotationAvailability(false); setStatus('Mất kết nối với xe'); setSystemStatus('Mất kết nối với xe'); $('connectBtn').textContent = 'Kết nối lại'; rxChar = null; txChar = null; };
        device.addEventListener('gattserverdisconnected', disconnectHandler);
        const characteristics = await connectGattWithRetry(device);
        rxChar = characteristics.rx;
        txChar = characteristics.tx;
        txChar.addEventListener('characteristicvaluechanged', e => {
          const message = new TextDecoder().decode(e.target.value).trim();
          console.log('[BLE RX]', performance.now().toFixed(1), message);
          $('lastCommand').textContent = message;
        });
        await authenticateBle(password);
        $('deviceName').textContent = device.name || 'ESP32-MOTOR'; $('dot').classList.remove('is-connecting'); setRotationAvailability(true); setStatus('Đã kết nối', true); $('connectBtn').textContent = 'Ngắt kết nối';
      } catch (e) { $('dot').classList.remove('is-connecting'); setRotationAvailability(false); rxChar = null; txChar = null; setStatus('Chưa kết nối'); setSystemStatus('Không thể kết nối. Hãy bật Bluetooth và thử lại.'); $('connectBtn').textContent = 'Kết nối thiết bị'; if (e.name !== 'NotFoundError') alert('Không kết nối được BLE: ' + e.message); }
      isConnecting = false;
      $('connectBtn').disabled = false;
    }
    function updateCommandUi(command, speed) {
      const percent = Math.round(Number(speed) / 255 * 100);
      if (command === 'f') {
        setDriveStatus('Đang tiến');
        setSystemStatus('Đang tiến · Tốc độ ' + percent + '%');
      } else if (command === 'b') {
        setDriveStatus('Đang lùi');
        setSystemStatus('Đang lùi · Tốc độ ' + percent + '%');
      } else if (command === 'l') {
        setDriveStatus('Đang quay trái');
        setSystemStatus('Đang quay trái · Tốc độ ' + percent + '%');
      } else if (command === 'r') {
        setDriveStatus('Đang quay phải');
        setSystemStatus('Đang quay phải · Tốc độ ' + percent + '%');
      } else if (command === 's') {
        setDriveStatus('Xe đang dừng');
        setSystemStatus('Xe đang dừng');
      }
    }
    async function pumpBleWrites() {
      if (bleWriteRunning) return;
      if (!rxChar || !device?.gatt?.connected) return;
      bleWriteRunning = true;

      try {
        while (device?.gatt?.connected) {
          let payload = null;

          // Motor/STOP luôn được ưu tiên và chỉ giữ trạng thái mới nhất.
          if (pendingMotionPayload !== null) {
            payload = pendingMotionPayload;
            pendingMotionPayload = null;
          } else if (pendingOtherPayloads.length > 0) {
            payload = pendingOtherPayloads.shift();
          } else {
            break;
          }

          if (!rxChar || !device?.gatt?.connected) break;
          // Motor cần phản hồi realtime: không chờ ACK của từng gói.
          const bytes = bleEncoder.encode(payload);
          if (rxChar.writeValueWithoutResponse) {
            await rxChar.writeValueWithoutResponse(bytes);
          } else {
            await rxChar.writeValue(bytes);
          }
          console.log('[BLE TX SENT]', performance.now().toFixed(1), payload);
          $('lastCommand').textContent = payload;
        }
      } catch (e) {
        pendingMotionPayload = null;
        pendingOtherPayloads.length = 0;
        setStatus('Mất kết nối với xe');
        setSystemStatus('Không thể gửi lệnh điều khiển');
      } finally {
        bleWriteRunning = false;
        if (pendingMotionPayload !== null || pendingOtherPayloads.length > 0) {
          queueMicrotask(pumpBleWrites);
        }
      }
    }

    function send(command) {
      if (!rxChar || !device?.gatt?.connected) { setStatus('Chưa kết nối'); return; }
      const speed = currentPwm; const payload = 'fblr'.includes(command) ? command + speed : command;
      // Cập nhật giao diện ngay khi phát lệnh, không chờ BLE write hoàn tất.
      updateCommandUi(command, speed);

      // Lệnh chuyển động/STOP là trạng thái, không phải transaction FIFO:
      // nếu người dùng đổi hướng nhanh, bỏ các lệnh cũ đang chờ để tránh trễ.
      if (['f', 'b', 'l', 'r', 's'].includes(command)) {
        pendingMotionPayload = payload;
      } else {
        // Servo hoặc command phụ dùng chung pump, nằm sau motor.
        pendingOtherPayloads.push(payload);
      }
      console.log('[BLE TX QUEUE]', performance.now().toFixed(1), payload);
      pumpBleWrites();
    }
    $('connectBtn').addEventListener('click', connectBle);
    $('fullscreenBtn').addEventListener('click', async () => {
      if (!document.documentElement.requestFullscreen) {
        alert('Trên iPhone, hãy chọn Chia sẻ → Thêm vào Màn hình chính để ẩn thanh địa chỉ.');
        return;
      }
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.warn('Không thể bật toàn màn hình:', error);
      }
    });
    document.addEventListener('fullscreenchange', () => {
      const isFullscreen = Boolean(document.fullscreenElement);
      $('fullscreenBtn').textContent = isFullscreen ? '×' : '⛶';
      $('fullscreenBtn').setAttribute('aria-label', isFullscreen ? 'Thoát toàn màn hình' : 'Bật toàn màn hình');
      $('fullscreenBtn').title = isFullscreen ? 'Thoát toàn màn hình' : 'Bật toàn màn hình';
    });
    let currentPwm = 0;
    function setPwm(value) {
      currentPwm = Math.max(0, Math.min(255, Number(value) || 0));
      const percent = Math.round(currentPwm / 255 * 100);
      $('speedPercent').textContent = percent + '%';
      speedPresets.forEach(button => {
        button.setAttribute('aria-pressed', String(Number(button.dataset.pwm) === currentPwm));
      });
    }
    speedPresets.forEach(button => button.addEventListener('click', () => setPwm(button.dataset.pwm)));
    setPwm(currentPwm);
    let servoAngle = 0;
    const servoLowerAngle = 45;
    function toggleServo() {
      servoAngle = servoAngle === 0 ? servoLowerAngle : 0;
      $('servoAngle').textContent = servoAngle === 0 ? 'Nâng · 0°' : 'Hạ · 45°';
      servoToggle.textContent = servoAngle === 0 ? 'Hạ' : 'Nâng';
      send('v' + servoAngle);
    }
    servoToggle.addEventListener('click', toggleServo);
    const motionButtons = [...document.querySelectorAll('[data-command]')].filter(btn => ['f', 'b', 'l', 'r'].includes(btn.dataset.command));
    const activePointerIds = new WeakMap();
    function releaseMotionButton(btn) {
      if (!btn.classList.contains('active')) return;
      btn.classList.remove('active');
      activePointerIds.delete(btn);
      send('s');
    }
    function deactivateMotionButton(btn) {
      if (!btn.classList.contains('active')) return;
      btn.classList.remove('active');
      activePointerIds.delete(btn);
    }
    function stopAllMotion() {
      let wasMoving = false;
      motionButtons.forEach(btn => {
        if (btn.classList.contains('active')) wasMoving = true;
        deactivateMotionButton(btn);
      });
      if (wasMoving) send('s');
    }
    motionButtons.forEach(btn => {
      btn.addEventListener('pointerdown', e => {
        if (btn.disabled) return;
        e.preventDefault();
        // Đổi hướng là một trạng thái mới, không cần gửi STOP trung gian.
        motionButtons.forEach(other => { if (other !== btn) deactivateMotionButton(other); });
        activePointerIds.set(btn, e.pointerId);
        if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId);
        btn.classList.add('active');
        send(btn.dataset.command);
      });
      btn.addEventListener('pointerup', e => {
        if (activePointerIds.get(btn) === e.pointerId) releaseMotionButton(btn);
      });
      btn.addEventListener('pointercancel', e => {
        if (activePointerIds.get(btn) === e.pointerId) releaseMotionButton(btn);
      });
      btn.addEventListener('lostpointercapture', () => {
        // Một số mobile browser mất pointerup khi pointer capture bị hủy.
        if (btn.classList.contains('active')) stopAllMotion();
      });
    });
    window.addEventListener('pointerup', stopAllMotion);
    window.addEventListener('pointercancel', stopAllMotion);
    window.addEventListener('blur', stopAllMotion);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopAllMotion();
    });
    $('emergency').addEventListener('click', () => send('s'));

    // Điều khiển bằng bàn phím: W/A/S/D nhấn giữ để chạy, thả ra để dừng.
    const keyboardCommandMap = { w: 'f', a: 'l', s: 'b', d: 'r' };
    let keyboardButton = null;
    let keyboardKey = null;
    const isTypingTarget = target => target && (
      target.matches('input, textarea, select') || target.isContentEditable
    );

    document.addEventListener('keydown', e => {
      if (isTypingTarget(e.target)) return;

      if (e.code === 'Space' || e.key === 'Escape') {
        e.preventDefault();
        keyboardButton = null;
        keyboardKey = null;
        motionButtons.forEach(releaseMotionButton);
        send('s');
        return;
      }

      const key = e.key.toLowerCase();
      if (key === 'o' && !e.repeat) {
        e.preventDefault();
        if (!servoToggle.disabled) toggleServo();
        return;
      }
      const command = keyboardCommandMap[key];
      if (!command || e.repeat) return;

      const button = motionButtons.find(btn => btn.dataset.command === command);
      if (!button) return;
      e.preventDefault();
      motionButtons.forEach(other => { if (other !== button) deactivateMotionButton(other); });
      keyboardButton = button;
      keyboardKey = key;
      button.classList.add('active');
      send(command);
    });

    document.addEventListener('keyup', e => {
      const key = e.key.toLowerCase();
      if (key !== keyboardKey || !keyboardButton) return;
      e.preventDefault();
      releaseMotionButton(keyboardButton);
      keyboardButton = null;
      keyboardKey = null;
    });

    window.addEventListener('blur', () => {
      keyboardButton = null;
      keyboardKey = null;
      motionButtons.forEach(releaseMotionButton);
    });
  </script>
</body>

</html>
