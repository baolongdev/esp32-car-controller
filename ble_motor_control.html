<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ESP32 Motor Control</title>
  <style>
    :root {
      --bg: #090d10;
      --surface: #111820;
      --surface-2: #18212a;
      --metal: #252e36;
      --border: #3a444d;
      --accent: #f5b928;
      --accent-light: #ffd45a;
      --text: #f3f4f2;
      --muted: #aeb9be;
      --cyan: #37d7dd;
      --danger: #e83f4f;
      --danger-dark: #711f2b;
      --font-page-title: clamp(20px, 2.8vw, 28px);
      --font-section-title: clamp(13px, 1.6vw, 16px);
      --font-body: clamp(12px, 1.35vw, 14px);
      --font-small: clamp(11px, 1.15vw, 12px);
      --font-button: clamp(12px, 1.35vw, 14px);
      --font-value: clamp(28px, 4vw, 40px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #090d10 0%, #0d141a 52%, #090d10 100%);
      color: var(--text);
      font: 15px/1.35 "Inter", system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    main {
      width: min(100%, 430px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      padding: 20px 18px 28px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-right: max(18px, env(safe-area-inset-right));
      padding-bottom: max(28px, env(safe-area-inset-bottom));
      padding-left: max(18px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    .landscape-left,
    .landscape-right {
      display: contents;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: clamp(10px, 1.2vw, 13px);
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    h1 {
      margin: 3px 0 0;
      font: 700 var(--font-page-title)/1.05 "Chakra Petch", "Inter", system-ui, sans-serif;
      letter-spacing: .01em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 1px solid var(--accent);
      border-radius: 2px;
      display: grid;
      place-items: center;
      color: var(--accent);
      clip-path: polygon(0 7px, 7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%);
    }

    .brand-mark svg {
      width: 24px;
      height: 24px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      background: linear-gradient(145deg, var(--surface-2), var(--surface));
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 14px;
      box-shadow: inset 0 1px #ffffff0d, inset 0 -2px #0008, 0 10px 24px #0006;
      clip-path: polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px));
    }

    .card::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      opacity: .2;
      pointer-events: none;
      background: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px), repeating-linear-gradient(135deg, transparent 0 18px, #ffffff08 19px 20px);
      background-size: 42px 42px, 42px 42px, auto;
      mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
    }

    .control-card::before,
    .speed-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 14px;
      width: 46px;
      height: 3px;
      background: var(--accent);
      box-shadow: 0 0 8px #f5b9282e;
      pointer-events: none;
    }

    .control-card::after {
      opacity: .26;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 5px #8e9aa31c;
    }

    .dot.connected {
      background: var(--cyan);
      box-shadow: 0 0 0 5px #37d7dd29;
    }

    .dot.is-connecting {
      background: var(--accent);
      animation: statusPulse 1.4s ease-in-out infinite;
    }

    .status-copy {
      flex: 1;
      min-width: 0;
    }

    .status-copy strong {
      display: block;
      font-size: clamp(14px, 1.8vw, 18px);
      font-weight: 700;
      white-space: nowrap;
    }

    .status-copy span {
      color: #c0c9cd;
      font-size: var(--font-small);
      white-space: nowrap;
    }

    .system-status {
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid #ffffff14;
      color: #cbd5d8;
      font-size: var(--font-body);
      min-width: 0;
    }

    button {
      border: 0;
      color: var(--text);
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .connect {
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: 2px;
      background: var(--accent);
      color: #171205;
      font-weight: 750;
      font-size: var(--font-button);
      white-space: nowrap;
      clip-path: polygon(0 6px, 6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
      transition: background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease, transform 80ms ease;
    }

    .connect:hover,
    .connect:focus-visible {
      background: var(--accent-light);
      box-shadow: 0 0 10px #f5b92845;
    }

    .connect:active {
      transform: translateY(1px);
    }

    .connect:disabled {
      opacity: .55;
      cursor: wait;
    }

    .section-label {
      margin: 0 0 10px;
      color: var(--accent-light);
      font-size: var(--font-section-title);
      font-weight: 700;
      letter-spacing: .01em;
      white-space: nowrap;
    }

    .speed-line {
      display: flex;
      justify-content: space-between;
      align-items: end;
    }

    .speed-value {
      color: var(--accent-light);
      font: 700 var(--font-value)/1 "Chakra Petch", "Inter", system-ui, sans-serif;
      letter-spacing: -.03em;
    }

    .speed-value small {
      color: var(--muted);
      font: 400 12px/1.2 "Inter", system-ui, sans-serif;
      letter-spacing: 0;
    }

    .speed-technical {
      display: block;
      margin-top: 5px;
      color: #c0c9cd;
      font: 500 var(--font-small)/1.2 "Inter", system-ui, sans-serif;
      letter-spacing: 0;
      white-space: nowrap;
    }

    input[type=range] {
      width: 100%;
      height: 30px;
      margin: 8px 0 0;
      cursor: pointer;
      appearance: none;
      background: transparent;
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      border: 1px solid #4a5861;
      background: linear-gradient(90deg, var(--accent) var(--progress, 71%), #28343d var(--progress, 71%));
    }

    input[type=range]::-moz-range-track {
      height: 6px;
      border: 1px solid #4a5861;
      background: #28343d;
    }

    input[type=range]::-moz-range-progress {
      height: 6px;
      background: var(--accent);
    }

    input[type=range]::-webkit-slider-thumb {
      width: 18px;
      height: 18px;
      margin-top: -7px;
      appearance: none;
      border: 2px solid var(--accent-light);
      border-radius: 50%;
      background: #111820;
      box-shadow: 0 0 8px #f5b92880;
    }

    input[type=range]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: 2px solid var(--accent-light);
      border-radius: 50%;
      background: #111820;
      box-shadow: 0 0 8px #f5b92880;
    }

    input[type=range]:focus-visible::-webkit-slider-thumb {
      box-shadow: 0 0 0 4px #f5b92835, 0 0 10px #f5b92880;
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      color: #c0c9cd;
      font-size: var(--font-small);
    }

    .speed-presets {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 9px;
    }

    .speed-preset {
      min-width: 0;
      min-height: 40px;
      padding: 7px 8px;
      border: 1px solid #46545e;
      background: linear-gradient(145deg, #26323b, #141c22);
      color: var(--text);
      font: 700 13px/1 Inter, system-ui, sans-serif;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .speed-preset:not(:disabled):hover,
    .speed-preset:not(:disabled):focus-visible {
      border-color: var(--accent-light);
    }

    .speed-preset[aria-pressed="true"] {
      border-color: var(--accent-light);
      background: var(--accent);
      color: #11161a;
      box-shadow: 0 0 10px #f5b92845, inset 0 2px 4px #fff3;
    }

    .speed-preset:disabled {
      opacity: .78;
      filter: none;
      cursor: not-allowed;
    }

    .control-card {
      padding: 16px 17px 18px;
    }

    .direction-pad {
      width: 100%;
      max-width: 270px;
      margin: 6px auto 12px;
      display: grid;
      grid-template-columns: minmax(64px, auto) 52px minmax(64px, auto);
      grid-template-rows: auto auto auto;
      align-items: center;
      justify-content: center;
      column-gap: 10px;
      row-gap: 7px;
    }

    .pad-item {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .pad-item button {
      width: 52px;
      height: 48px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      background: linear-gradient(145deg, #28343d, #182129);
      border: 1px solid #5a6872;
      border-radius: 2px;
      font-size: 22px;
      color: var(--text);
      transition: .12s transform, .12s background, .12s box-shadow;
      touch-action: none;
      clip-path: polygon(0 7px, 7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .control-label {
      max-width: 100%;
      color: #cbd5d8;
      font: 600 clamp(11px, 1.5vw, 13px)/1.2 "Inter", system-ui, sans-serif;
      white-space: nowrap;
      word-break: keep-all;
      overflow-wrap: normal;
    }

    .pad-item button:active,
    .pad-item button.active {
      transform: scale(.95);
      background: var(--accent);
      color: #171205;
      border-color: var(--accent-light);
      box-shadow: inset 0 0 0 2px #8c6713, inset 0 4px 8px #0007;
    }

    .forward {
      grid-column: 2;
      grid-row: 1;
    }

    .left {
      grid-column: 1;
      grid-row: 2;
    }

    .stop {
      grid-column: 2;
      grid-row: 2;
    }

    .right {
      grid-column: 3;
      grid-row: 2;
    }

    .reverse {
      grid-column: 2;
      grid-row: 3;
    }

    .stop button {
      color: var(--danger);
    }

    .drive-status {
      min-height: 20px;
      margin-top: 8px;
      color: #e0e6e7;
      text-align: center;
      font-size: var(--font-body);
      font-weight: 600;
      white-space: nowrap;
    }

    .drive-status.is-moving::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px #f5b9288c;
      animation: statusPulse 1.4s ease-in-out infinite;
    }

    .hint {
      text-align: center;
      color: #cbd5d8;
      font-size: var(--font-body);
      letter-spacing: 0;
    }

    .rotation-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #ffffff14;
    }

    .rotation-description {
      margin: -4px 0 8px;
      color: #aeb9be;
      font-size: var(--font-small);
    }

    .rotation-controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      width: min(100%, 230px);
      margin-inline: auto;
    }

    .rotation-button {
      min-width: 0;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 6px;
      color: var(--text);
      background: linear-gradient(145deg, #26323b, #141c22);
      border: 1px solid #3d4b55;
      border-radius: 2px;
      font-size: var(--font-button);
      font-weight: 700;
      white-space: nowrap;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      clip-path: polygon(0 6px, 6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
      box-shadow: inset 0 1px #ffffff14, inset 0 -4px 8px #0005, 0 3px 8px #0005;
      transition: background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease, transform 80ms ease;
    }

    .rotation-button .icon {
      font-size: 22px;
      line-height: 1;
    }

    .rotation-button:hover:not(:disabled),
    .rotation-button:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 10px #f5b92835, inset 0 1px #ffffff14;
    }

    .rotation-button:active:not(:disabled),
    .rotation-button.active {
      color: #11161a;
      background: linear-gradient(145deg, #ffd052, #e5a816);
      border-color: var(--accent-light);
      transform: translateY(2px);
      box-shadow: 0 0 12px #f5b92852, inset 0 2px 3px #ffffff38;
    }

    .rotation-button:disabled {
      cursor: not-allowed;
      opacity: .82;
      filter: none;
    }

    .emergency {
      width: 100%;
      min-height: 48px;
      padding: 12px 15px;
      border-radius: 2px;
      background: var(--danger-dark);
      border: 1px solid var(--danger);
      color: #ffd8dc;
      font-weight: 900;
      font-size: var(--font-button);
      letter-spacing: .07em;
      text-transform: uppercase;
      white-space: nowrap;
      clip-path: polygon(0 7px, 7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%);
      box-shadow: inset 0 1px #fff2, 0 5px 14px #0005;
    }

    .emergency::before {
      content: "⚠";
      display: inline-block;
      margin-right: 8px;
      font-size: 16px;
      vertical-align: -1px;
    }

    .emergency-note {
      display: block;
      margin-bottom: 6px;
      color: #c2cdd1;
      font-size: 11px;
      text-align: center;
    }

    .emergency:active {
      background: var(--danger);
      color: #fff;
      transform: translateY(1px);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      padding: 0 3px;
    }

    @keyframes statusPulse {

      0%,
      100% {
        opacity: .55;
        box-shadow: 0 0 0 0 #f5b92800;
      }

      50% {
        opacity: 1;
        box-shadow: 0 0 0 5px #f5b9281f;
      }
    }

    .servo-control {
      display: grid;
      gap: 4px;
      margin-top: 6px;
      min-width: 0;
    }

    .servo-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .servo-heading strong {
      color: var(--accent-light);
      white-space: nowrap;
    }

    .servo-toggle {
      width: 100%;
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid var(--accent);
      background: #252d33;
      color: var(--text);
      font: 700 12px/1.2 Inter, system-ui, sans-serif;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .servo-toggle:not(:disabled):active {
      background: var(--accent);
      color: #11161a;
      transform: translateY(1px);
    }

    @media (orientation:portrait) {
      .status-card {
        order: 1;
      }

      .speed-card {
        order: 2;
      }

      .landscape-left {
        order: 3;
      }

      .control-card {
        order: 3;
      }

      .landscape-right {
        display: contents;
      }

      .emergency {
        order: 4;
      }

      .footer {
        order: 5;
      }
    }

    @media (orientation:landscape) and (min-width:568px) {
      main {
        width: 100%;
        max-width: 980px;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        padding: 10px 14px;
        padding-top: max(10px, env(safe-area-inset-top));
        padding-right: max(14px, env(safe-area-inset-right));
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        padding-left: max(14px, env(safe-area-inset-left));
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(250px, .95fr);
        grid-template-rows: auto minmax(0, 1fr);
        gap: 8px 10px;
        overflow: hidden;
      }

      header {
        grid-column: 1 / -1;
        min-width: 0;
      }

      .landscape-left {
        display: flex;
        grid-column: 1;
        grid-row: 2;
        min-width: 0;
        min-height: 0;
      }

      .landscape-right {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-column: 2;
        grid-row: 2;
        gap: 8px;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .control-card {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .status-card {
        grid-row: 1;
        min-width: 0;
      }

      .speed-card {
        grid-row: 2;
        min-width: 0;
        min-height: 0;
        align-self: stretch;
      }

      .emergency {
        grid-row: 3;
        min-width: 0;
      }

      .direction-pad {
        max-width: 270px;
        margin: 6px auto 8px;
      }

      .footer {
        display: none;
      }
    }

    @media (orientation:landscape) and (max-height:600px) {
      main {
        padding-top: max(6px, env(safe-area-inset-top));
        padding-bottom: max(6px, env(safe-area-inset-bottom));
        gap: 6px 8px;
      }

      h1 {
        font-size: 21px;
        margin-top: 1px;
      }

      .eyebrow {
        font-size: 10px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 2px;
      }

      .brand-mark svg {
        width: 19px;
        height: 19px;
      }

      .card {
        padding: 8px 10px;
      }

      .status-row {
        gap: 7px;
      }

      .status-copy strong {
        font-size: 14px;
      }

      .status-copy span,
      .range-labels {
        font-size: 11px;
      }

      .section-label {
        font-size: 12px;
      }

      .hint {
        font-size: 11px;
      }

      .connect {
        min-height: 42px;
        margin-top: 6px;
        padding: 7px 8px;
        font-size: 12px;
      }

      .speed-value {
        font-size: 29px;
      }

      input[type=range] {
        margin: 2px 0 0;
      }

      .control-card {
        padding: 10px 12px;
      }

      .direction-pad {
        max-width: 230px;
        grid-template-columns: 64px 48px 64px;
        column-gap: 8px;
        row-gap: 5px;
        margin: 2px auto 4px;
      }

      .pad-item button {
        width: 48px;
        height: 44px;
        font-size: 20px;
      }

      .control-label {
        font-size: 11px;
      }

      .emergency {
        min-height: 44px;
        padding: 8px;
        font-size: 13px;
      }

      .emergency-note {
        display: none;
      }

      .rotation-section {
        margin-top: 7px;
        padding-top: 6px;
      }

      .rotation-description {
        display: none;
      }

      .rotation-controls {
        gap: 6px;
      }

      .rotation-button {
        min-height: 40px;
        font-size: 11px;
      }

      .rotation-button .icon {
        font-size: 18px;
      }

      .system-status {
        margin-top: 5px;
        padding-top: 5px;
        font-size: 11px;
      }

      .footer {
        display: none;
      }
    }

    @media (orientation:landscape) and (max-height:400px) {
      .hint {
        display: none;
      }

      .direction-pad {
        row-gap: 3px;
        margin-bottom: 3px;
      }

      .pad-item button {
        width: 44px;
        height: 42px;
        min-height: 40px;
      }

      .drive-status {
        margin-top: 3px;
      }

      .rotation-section {
        margin-top: 3px;
        padding-top: 4px;
      }

      .pivot-panel .rotation-controls .pad-item button {
        min-height: 40px;
        font-size: clamp(24px, 6vh, 32px);
      }
    }

    /* Portrait: nút lớn, giãn theo chiều cao màn hình */
    @media (orientation: portrait) {
      .linear-panel .linear-controls,
      .pivot-panel .rotation-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: minmax(0, 1fr);
        align-items: stretch;
        justify-content: stretch;
        align-content: stretch;
        height: 100%;
      }

      .linear-panel .linear-controls .pad-item,
      .pivot-panel .rotation-controls .pad-item {
        position: relative;
        display: grid;
        grid-template-rows: minmax(0, 1fr);
        height: 100%;
        width: 100%;
        min-width: 0;
        align-self: stretch;
        justify-self: stretch;
        min-height: 0;
        gap: 0;
      }

      .linear-panel .linear-controls .pad-item button,
      .pivot-panel .rotation-controls .pad-item button {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        min-height: 0;
        max-height: none;
        align-self: stretch;
        justify-self: stretch;
        font-size: clamp(32px, 7vw, 46px);
      }

      .linear-panel .linear-controls .pad-item .control-label,
      .pivot-panel .rotation-controls .pad-item .control-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 6px;
        pointer-events: none;
        z-index: 1;
      }

      .control-layout > .linear-panel,
      .control-layout > .pivot-panel {
        min-height: clamp(240px, 34vh, 320px);
      }

      .linear-spacer {
        display: none;
      }
    }

    /* FIX: rotation buttons full width + landscape giữ 2 cột */
    .rotation-controls {
      width: 100%;
      max-width: none;
    }

    .rotation-controls .pad-item {
      width: 100%;
      min-width: 0;
    }

    .rotation-button,
    .linear-button {
      display: grid;
      place-items: center;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
    }

    @media (orientation: landscape) {
      .pivot-panel .rotation-controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: 1fr;
        gap: 8px;
      }
    }

    /* =========================================================
       FINAL FIX - 2 CỘT × 1 DÒNG + BUTTON FULL WIDTH
       ========================================================= */

    @media (orientation: landscape) {
      .linear-panel .linear-controls,
      .pivot-panel .rotation-controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: minmax(0, 1fr);
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        gap: 8px;
        align-items: stretch;
        justify-items: stretch;
        align-content: stretch;
      }

      .linear-panel .linear-controls > .pad-item,
      .pivot-panel .rotation-controls > .pad-item {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        align-self: stretch;
        justify-self: stretch;
        margin: 0;
        padding: 0;
      }

      .linear-panel .linear-controls > .pad-item > button,
      .pivot-panel .rotation-controls > .pad-item > button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100% !important;
        max-width: none !important;
        min-width: 0 !important;
        height: 100% !important;
        min-height: 60px;
        max-height: none !important;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        border-radius: 2px;
        clip-path: polygon(0 6px, 6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%);
        background: linear-gradient(145deg, #26323b, #141c22);
        border: 1px solid #46545e;
        font-size: clamp(28px, 5vh, 40px);
        align-self: stretch;
        justify-self: stretch;
        box-shadow: inset 0 1px #ffffff14, inset 0 -4px 8px #0005, 0 3px 8px #0005;
        transition: background-color 140ms ease, color 140ms ease,
                    border-color 140ms ease, box-shadow 140ms ease, transform 80ms ease;
      }

      .linear-panel .linear-controls > .pad-item > button > .control-label,
      .pivot-panel .rotation-controls > .pad-item > button > .control-label {
        position: static;
        display: block;
        pointer-events: none;
        color: inherit;
        font-size: clamp(12px, 1.8vh, 15px);
        font-weight: 700;
        line-height: 1.1;
        text-align: center;
        white-space: nowrap;
      }
    }

    /* Bên Xoay giống hệt bên Di chuyển: ẩn dòng mô tả */
    .linear-panel .linear-spacer,
    .pivot-panel .rotation-description {
      display: none;
    }

    /* Khi bấm/giữ, đổi màu vàng cho 4 nút điều khiển */
    .linear-panel .linear-controls > .pad-item > button:active,
    .linear-panel .linear-controls > .pad-item > button.active,
    .pivot-panel .rotation-controls > .pad-item > button:active,
    .pivot-panel .rotation-controls > .pad-item > button.active {
      background: linear-gradient(145deg, #ffdd6b, #f5b928) !important;
      color: #171205 !important;
      border-color: #ffe08a !important;
      box-shadow: 0 0 16px #f5b92859, inset 0 1px #ffffff38 !important;
      transform: scale(.95);
    }

    .linear-panel .linear-controls > .pad-item > button.active > .control-label,
    .pivot-panel .rotation-controls > .pad-item > button.active > .control-label {
      color: #171205;
    }

    /* Nhãn trong button luôn theo màu icon, không tách rời */
    .linear-panel .linear-controls > .pad-item > button > .control-label,
    .pivot-panel .rotation-controls > .pad-item > button > .control-label {
      position: static !important;
      color: inherit !important;
      background: transparent !important;
    }

    /* 4 nút khi chưa kết nối: vẫn rõ ràng nhưng không khả dụng */
    .linear-panel .linear-controls > .pad-item > button:disabled,
    .pivot-panel .rotation-controls > .pad-item > button:disabled {
      cursor: not-allowed;
      opacity: .82;
      filter: none;
      color: #d7dee1;
      background: linear-gradient(145deg, #222d35, #151d23);
      border-color: #3f4d56;
      box-shadow:
        inset 0 1px rgba(255,255,255,.05),
        inset 0 -3px 7px rgba(0,0,0,.35);
      transform: none;
      -webkit-text-fill-color: currentColor;
    }

    .linear-panel .linear-controls > .pad-item > button:disabled .control-label,
    .pivot-panel .rotation-controls > .pad-item > button:disabled .control-label {
      opacity: 1;
      color: inherit;
    }

    /* 4 nút hover: cùng viền vàng + glow */
    .linear-panel .linear-controls > .pad-item > button:hover:not(:disabled),
    .linear-panel .linear-controls > .pad-item > button:focus-visible,
    .pivot-panel .rotation-controls > .pad-item > button:hover:not(:disabled),
    .pivot-panel .rotation-controls > .pad-item > button:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 10px #f5b92835, inset 0 1px #ffffff14;
    }

    /* =========================================================
       FINAL: thu gọn speed-card trong landscape để dành chỗ cho
       linear-panel + pivot-panel (4 nút điều khiển)
       ========================================================= */
    @media (orientation: landscape) {
      main > .speed-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(135px, .32fr);
        grid-template-rows: auto auto;
        column-gap: 12px;
        row-gap: 2px;
        width: 100%;
        height: 74px;
        min-height: 0;
        margin: 0;
        padding: 5px 10px;
        flex: 0 0 74px;
        align-items: center;
        overflow: hidden;
      }

      main > .speed-card .speed-line {
        grid-column: 1;
        grid-row: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 0;

      main > .speed-card .section-label {
        margin: 0;
        font-size: 11px;
        line-height: 1;
      }

      main > .speed-card .speed-value {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 23px;
        line-height: 1;
      }

      main > .speed-card .speed-technical {
        display: inline;
        margin: 0;
        font-size: 9px;
        line-height: 1;
        white-space: nowrap;
      }

      main > .speed-card .speed-presets {
        grid-column: 1;
        grid-row: 2;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
        margin: 0;
      }

      main > .speed-card .speed-preset {
        min-height: 0;
        height: 28px;
        padding: 2px 6px;
        font-size: 10px;
        line-height: 1;
      }

      main > .speed-card .servo-control {
        grid-column: 2;
        grid-row: 1 / 3;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 4px;
        margin: 0;
        min-width: 0;
        align-self: stretch;
      }

      main > .speed-card .servo-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 5px;
        min-width: 0;
      }

      main > .speed-card .servo-heading strong {
        font-size: 10px;
        line-height: 1;
        white-space: nowrap;
      }

      main > .speed-card .servo-toggle {
        width: 100%;
        height: 28px;
        min-height: 0;
        padding: 2px 8px;
        font-size: 10px;
      }
    }

    @media (orientation: landscape) and (max-height: 430px) {
      main > .speed-card {
        height: 62px;
        min-height: 0;
        flex-basis: 62px;
        padding: 4px 8px;
      }

      main > .speed-card .speed-value {
        font-size: 20px;
      }

      main > .speed-card .speed-preset,
      main > .speed-card .servo-toggle {
        height: 25px;
        min-height: 0;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="header">
      <div class="header-brand">
        <div>
          <div class="eyebrow">BẢNG ĐIỀU KHIỂN</div>
          <h1>Điều khiển xe</h1>
        </div>
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24">
            <path d="M5 9h14v8H5z" />
            <path d="M8 9V6h8v3M8 13h.01M16 13h.01M8 17v2m8-2v2M3 12h2m14 0h2" />
          </svg></div>
      </div>
      <div class="header-ble-status" aria-live="polite">
        <i class="dot" id="dot"></i>
        <div class="header-ble-copy"><strong id="status">Chưa kết nối</strong><span
            id="deviceName">ESP32-MOTOR</span><span id="systemStatus" class="sr-only">Kết nối thiết bị để bắt
            đầu</span><span id="signal" class="sr-only">—</span></div>
      </div>
      <div class="header-actions">
        <button class="connect header-connect-button" id="connectBtn">Kết nối thiết bị</button>
        <button class="fullscreen-button" id="fullscreenBtn" type="button" aria-label="Bật toàn màn hình" title="Bật toàn màn hình">⛶</button>
      </div>
    </header>

    <section class="card panel speed-card">
      <div class="speed-line">
        <div class="section-label">Tốc độ</div>
        <div class="speed-value"><span id="speedPercent">0%</span></div>
      </div>
      <div class="speed-presets" role="group" aria-label="Chọn tốc độ">
        <button class="speed-preset" type="button" data-pwm="191" aria-pressed="false">SLOW</button>
        <button class="speed-preset" type="button" data-pwm="217" aria-pressed="false">MEDIUM</button>
        <button class="speed-preset" type="button" data-pwm="255" aria-pressed="false">HIGH</button>
      </div>
      <div class="servo-control">
        <div class="servo-heading"><span class="section-label">Servo</span><strong id="servoAngle">Đóng · 0°</strong></div>
        <button id="servoToggle" class="servo-toggle" type="button" disabled>Mở</button>
      </div>
    </section>

    <div class="control-layout">
      <section class="card panel linear-panel">
        <div class="section-label">Điều khiển di chuyển</div>
        <div class="rotation-description linear-spacer" aria-hidden="true"></div>
        <div class="linear-controls">
          <div class="pad-item"><button class="linear-button" data-command="f" aria-label="Tiến">↑<span
                class="control-label">Tiến</span></button></div>
          <div class="pad-item"><button class="linear-button" data-command="b" aria-label="Lùi">↓<span
                class="control-label">Lùi</span></button></div>
        </div>
        <div class="panel-footer">
          <div class="drive-status" id="driveStatus" aria-live="polite">Xe đang dừng</div>
          <div class="hint">Nhấn giữ để di chuyển • Thả tay để dừng</div>
        </div>
      </section>

      <section class="card panel pivot-panel">
        <div class="section-label">Xoay tại chỗ</div>
        <div class="rotation-description">Hai bánh quay ngược chiều</div>
        <div class="rotation-controls">
          <div class="pad-item">
            <button id="turnLeftBtn" class="rotation-button" data-command="l"
              aria-label="Xoay trái tại chỗ" title="Xoay trái tại chỗ">↺<span class="control-label">Xoay trái</span></button>
          </div>
          <div class="pad-item">
            <button id="turnRightBtn" class="rotation-button" data-command="r"
              aria-label="Xoay phải tại chỗ" title="Xoay phải tại chỗ">↻<span class="control-label">Xoay phải</span></button>
          </div>
        </div>
        <div class="panel-footer">
          <div class="drive-status pivot-status" aria-live="polite">Giữ nút để xoay</div>
          <div class="hint">Nhấn giữ để xoay • Thả tay để dừng</div>
        </div>
      </section>

      <button class="emergency" id="emergency">DỪNG KHẨN CẤP</button>
    </div>
    <div class="footer"><span>ESP32-MOTOR</span><span id="lastCommand">Chưa có lệnh</span></div>
  </main>
  <script>
    const SERVICE = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    const TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
    let device, rxChar, txChar;
    let bleWriteRunning = false;
    let pendingMotionPayload = null;
    const pendingOtherPayloads = [];
    const bleEncoder = new TextEncoder();
    let isConnecting = false;
    let disconnectHandler = null;
    const $ = id => document.getElementById(id);
    const rotationButtons = [$('turnLeftBtn'), $('turnRightBtn')];
    const servoToggle = $('servoToggle');
    const speedPresets = [...document.querySelectorAll('.speed-preset')];
    function setRotationAvailability(enabled) {
      rotationButtons.forEach(button => { button.disabled = !enabled; });
      document.querySelectorAll('[data-command]').forEach(button => { button.disabled = !enabled; });
      servoToggle.disabled = !enabled;
      speedPresets.forEach(button => { button.disabled = !enabled; });
    }
    setRotationAvailability(false);
    function setSystemStatus(text) { $('systemStatus').textContent = text; }
    function setDriveStatus(text) { $('driveStatus').textContent = text; $('driveStatus').classList.toggle('is-moving', text !== 'Xe đang dừng'); }
    function setStatus(text, connected = false) { $('status').textContent = text; $('dot').classList.toggle('connected', connected); $('signal').textContent = connected ? '●' : '—'; setSystemStatus(connected ? 'Xe sẵn sàng điều khiển' : 'Hãy kết nối thiết bị để bắt đầu'); }
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    async function authenticateBle(password) {
      setStatus('Đang xác thực…');
      const result = new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error('Hết thời gian xác thực')), 4000);
        const onNotification = event => {
          const message = new TextDecoder().decode(event.target.value).trim();
          if (message === 'AUTH OK' || message === 'AUTH FAIL' || message === 'AUTH REQUIRED') {
            clearTimeout(timeout);
            txChar.removeEventListener('characteristicvaluechanged', onNotification);
            if (message === 'AUTH OK') resolve(message);
            else reject(new Error('Mật khẩu không đúng'));
          }
        };
        txChar.addEventListener('characteristicvaluechanged', onNotification);
      });
      await rxChar.writeValue(new TextEncoder().encode('AUTH:' + password));
      await result;
    }
    async function connectGattWithRetry(selectedDevice) {
      let lastError;
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          const server = selectedDevice.gatt.connected ? selectedDevice.gatt : await selectedDevice.gatt.connect();
          const service = await server.getPrimaryService(SERVICE);
          const rx = await service.getCharacteristic(RX);
          const tx = await service.getCharacteristic(TX);
          await tx.startNotifications();
          return { rx, tx };
        } catch (error) {
          lastError = error;
          rxChar = null;
          txChar = null;
          try { if (selectedDevice.gatt?.connected) selectedDevice.gatt.disconnect(); } catch (_) {}
          if (attempt < 3) await wait(350 * attempt);
        }
      }
      throw lastError;
    }
    async function connectBle() {
      if (isConnecting) return;
      if (!navigator.bluetooth) return alert('Trình duyệt chưa hỗ trợ Web Bluetooth. Hãy dùng Chrome/Edge trên Android hoặc HTTPS/localhost.');
      if (device?.gatt?.connected) { device.gatt.disconnect(); setRotationAvailability(false); setStatus('Chưa kết nối'); $('connectBtn').textContent = 'Kết nối thiết bị'; return; }
      isConnecting = true;
      $('connectBtn').disabled = true; $('connectBtn').textContent = 'Đang kết nối…'; $('dot').classList.add('is-connecting');
      try {
        // requestDevice phải được gọi trực tiếp từ thao tác bấm nút.
        // Không gọi prompt trước bước này vì sẽ làm mất user gesture.
        const selectedDevice = await navigator.bluetooth.requestDevice({
          // Lọc theo tên; service vẫn được kiểm tra sau khi kết nối qua
          // getPrimaryService(SERVICE). Cách này tránh phụ thuộc việc UUID
          // 128-bit nằm trong advertising packet hay scan response.
          filters: [{ namePrefix: 'ESP32-MOTOR' }],
          optionalServices: [SERVICE]
        });
        const password = window.prompt('Nhập mật khẩu kết nối thiết bị:');
        if (password === null) {
          isConnecting = false;
          $('connectBtn').disabled = false;
          $('connectBtn').textContent = 'Kết nối thiết bị';
          $('dot').classList.remove('is-connecting');
          return;
        }
        if (device && disconnectHandler) device.removeEventListener('gattserverdisconnected', disconnectHandler);
        device = selectedDevice;
        disconnectHandler = () => { pendingMotionPayload = null; pendingOtherPayloads.length = 0; setRotationAvailability(false); setStatus('Mất kết nối với xe'); setSystemStatus('Mất kết nối với xe'); $('connectBtn').textContent = 'Kết nối lại'; rxChar = null; txChar = null; };
        device.addEventListener('gattserverdisconnected', disconnectHandler);
        const characteristics = await connectGattWithRetry(device);
        rxChar = characteristics.rx;
        txChar = characteristics.tx;
        txChar.addEventListener('characteristicvaluechanged', e => {
          const message = new TextDecoder().decode(e.target.value).trim();
          console.log('[BLE RX]', performance.now().toFixed(1), message);
          $('lastCommand').textContent = message;
        });
        await authenticateBle(password);
        $('deviceName').textContent = device.name || 'ESP32-MOTOR'; $('dot').classList.remove('is-connecting'); setRotationAvailability(true); setStatus('Đã kết nối', true); $('connectBtn').textContent = 'Ngắt kết nối';
      } catch (e) { $('dot').classList.remove('is-connecting'); setRotationAvailability(false); rxChar = null; txChar = null; setStatus('Chưa kết nối'); setSystemStatus('Không thể kết nối. Hãy bật Bluetooth và thử lại.'); $('connectBtn').textContent = 'Kết nối thiết bị'; if (e.name !== 'NotFoundError') alert('Không kết nối được BLE: ' + e.message); }
      isConnecting = false;
      $('connectBtn').disabled = false;
    }
    function updateCommandUi(command, speed) {
      const percent = Math.round(Number(speed) / 255 * 100);
      if (command === 'f') {
        setDriveStatus('Đang tiến');
        setSystemStatus('Đang tiến · Tốc độ ' + percent + '%');
      } else if (command === 'b') {
        setDriveStatus('Đang lùi');
        setSystemStatus('Đang lùi · Tốc độ ' + percent + '%');
      } else if (command === 'l') {
        setDriveStatus('Đang quay trái');
        setSystemStatus('Đang quay trái · Tốc độ ' + percent + '%');
      } else if (command === 'r') {
        setDriveStatus('Đang quay phải');
        setSystemStatus('Đang quay phải · Tốc độ ' + percent + '%');
      } else if (command === 's') {
        setDriveStatus('Xe đang dừng');
        setSystemStatus('Xe đang dừng');
      }
    }
    async function pumpBleWrites() {
      if (bleWriteRunning) return;
      if (!rxChar || !device?.gatt?.connected) return;
      bleWriteRunning = true;

      try {
        while (device?.gatt?.connected) {
          let payload = null;

          // Motor/STOP luôn được ưu tiên và chỉ giữ trạng thái mới nhất.
          if (pendingMotionPayload !== null) {
            payload = pendingMotionPayload;
            pendingMotionPayload = null;
          } else if (pendingOtherPayloads.length > 0) {
            payload = pendingOtherPayloads.shift();
          } else {
            break;
          }

          if (!rxChar || !device?.gatt?.connected) break;
          // Motor cần phản hồi realtime: không chờ ACK của từng gói.
          const bytes = bleEncoder.encode(payload);
          if (rxChar.writeValueWithoutResponse) {
            await rxChar.writeValueWithoutResponse(bytes);
          } else {
            await rxChar.writeValue(bytes);
          }
          console.log('[BLE TX SENT]', performance.now().toFixed(1), payload);
          $('lastCommand').textContent = payload;
        }
      } catch (e) {
        pendingMotionPayload = null;
        pendingOtherPayloads.length = 0;
        setStatus('Mất kết nối với xe');
        setSystemStatus('Không thể gửi lệnh điều khiển');
      } finally {
        bleWriteRunning = false;
        if (pendingMotionPayload !== null || pendingOtherPayloads.length > 0) {
          queueMicrotask(pumpBleWrites);
        }
      }
    }

    function send(command) {
      if (!rxChar || !device?.gatt?.connected) { setStatus('Chưa kết nối'); return; }
      const speed = currentPwm; const payload = 'fblr'.includes(command) ? command + speed : command;
      // Cập nhật giao diện ngay khi phát lệnh, không chờ BLE write hoàn tất.
      updateCommandUi(command, speed);

      // Lệnh chuyển động/STOP là trạng thái, không phải transaction FIFO:
      // nếu người dùng đổi hướng nhanh, bỏ các lệnh cũ đang chờ để tránh trễ.
      if (['f', 'b', 'l', 'r', 's'].includes(command)) {
        pendingMotionPayload = payload;
      } else {
        // Servo hoặc command phụ dùng chung pump, nằm sau motor.
        pendingOtherPayloads.push(payload);
      }
      console.log('[BLE TX QUEUE]', performance.now().toFixed(1), payload);
      pumpBleWrites();
    }
    $('connectBtn').addEventListener('click', connectBle);
    $('fullscreenBtn').addEventListener('click', async () => {
      if (!document.documentElement.requestFullscreen) {
        alert('Trên iPhone, hãy chọn Chia sẻ → Thêm vào Màn hình chính để ẩn thanh địa chỉ.');
        return;
      }
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.warn('Không thể bật toàn màn hình:', error);
      }
    });
    document.addEventListener('fullscreenchange', () => {
      const isFullscreen = Boolean(document.fullscreenElement);
      $('fullscreenBtn').textContent = isFullscreen ? '×' : '⛶';
      $('fullscreenBtn').setAttribute('aria-label', isFullscreen ? 'Thoát toàn màn hình' : 'Bật toàn màn hình');
      $('fullscreenBtn').title = isFullscreen ? 'Thoát toàn màn hình' : 'Bật toàn màn hình';
    });
    let currentPwm = 0;
    function setPwm(value) {
      currentPwm = Math.max(0, Math.min(255, Number(value) || 0));
      const percent = Math.round(currentPwm / 255 * 100);
      $('speedPercent').textContent = percent + '%';
      speedPresets.forEach(button => {
        button.setAttribute('aria-pressed', String(Number(button.dataset.pwm) === currentPwm));
      });
    }
    speedPresets.forEach(button => button.addEventListener('click', () => setPwm(button.dataset.pwm)));
    setPwm(currentPwm);
    let servoAngle = 0;
    servoToggle.addEventListener('click', () => {
      servoAngle = servoAngle === 0 ? 150 : 0;
      $('servoAngle').textContent = servoAngle === 0 ? 'Đóng · 0°' : 'Mở · 150°';
      servoToggle.textContent = servoAngle === 0 ? 'Mở' : 'Đóng';
      send('v' + servoAngle);
    });
    const motionButtons = [...document.querySelectorAll('[data-command]')].filter(btn => ['f', 'b', 'l', 'r'].includes(btn.dataset.command));
    const activePointerIds = new WeakMap();
    function releaseMotionButton(btn) {
      if (!btn.classList.contains('active')) return;
      btn.classList.remove('active');
      activePointerIds.delete(btn);
      send('s');
    }
    function deactivateMotionButton(btn) {
      if (!btn.classList.contains('active')) return;
      btn.classList.remove('active');
      activePointerIds.delete(btn);
    }
    function stopAllMotion() {
      let wasMoving = false;
      motionButtons.forEach(btn => {
        if (btn.classList.contains('active')) wasMoving = true;
        deactivateMotionButton(btn);
      });
      if (wasMoving) send('s');
    }
    motionButtons.forEach(btn => {
      btn.addEventListener('pointerdown', e => {
        if (btn.disabled) return;
        e.preventDefault();
        // Đổi hướng là một trạng thái mới, không cần gửi STOP trung gian.
        motionButtons.forEach(other => { if (other !== btn) deactivateMotionButton(other); });
        activePointerIds.set(btn, e.pointerId);
        if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId);
        btn.classList.add('active');
        send(btn.dataset.command);
      });
      btn.addEventListener('pointerup', e => {
        if (activePointerIds.get(btn) === e.pointerId) releaseMotionButton(btn);
      });
      btn.addEventListener('pointercancel', e => {
        if (activePointerIds.get(btn) === e.pointerId) releaseMotionButton(btn);
      });
      btn.addEventListener('lostpointercapture', () => {
        // Một số mobile browser mất pointerup khi pointer capture bị hủy.
        if (btn.classList.contains('active')) stopAllMotion();
      });
    });
    window.addEventListener('pointerup', stopAllMotion);
    window.addEventListener('pointercancel', stopAllMotion);
    window.addEventListener('blur', stopAllMotion);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopAllMotion();
    });
    $('emergency').addEventListener('click', () => send('s'));

    // Điều khiển bằng bàn phím: W/A/S/D nhấn giữ để chạy, thả ra để dừng.
    const keyboardCommandMap = { w: 'f', a: 'l', s: 'b', d: 'r' };
    let keyboardButton = null;
    let keyboardKey = null;
    const isTypingTarget = target => target && (
      target.matches('input, textarea, select') || target.isContentEditable
    );

    document.addEventListener('keydown', e => {
      if (isTypingTarget(e.target)) return;

      if (e.code === 'Space' || e.key === 'Escape') {
        e.preventDefault();
        keyboardButton = null;
        keyboardKey = null;
        motionButtons.forEach(releaseMotionButton);
        send('s');
        return;
      }

      const key = e.key.toLowerCase();
      const command = keyboardCommandMap[key];
      if (!command || e.repeat) return;

      const button = motionButtons.find(btn => btn.dataset.command === command);
      if (!button) return;
      e.preventDefault();
      motionButtons.forEach(other => { if (other !== button) deactivateMotionButton(other); });
      keyboardButton = button;
      keyboardKey = key;
      button.classList.add('active');
      send(command);
    });

    document.addEventListener('keyup', e => {
      const key = e.key.toLowerCase();
      if (key !== keyboardKey || !keyboardButton) return;
      e.preventDefault();
      releaseMotionButton(keyboardButton);
      keyboardButton = null;
      keyboardKey = null;
    });

    window.addEventListener('blur', () => {
      keyboardButton = null;
      keyboardKey = null;
      motionButtons.forEach(releaseMotionButton);
    });
  </script>
</body>
